name: CI

on:
  pull_request:
  push:
    branches-ignore: [release]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain (version pinned in rust-toolchain.toml)
        run: |
          TOOLCHAIN=$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$TOOLCHAIN"
          rustc --version && cargo clippy --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
          cache-on-failure: true

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check default features build lean
        run: cargo check

      - name: Run tests
        run: cargo test --all-features
